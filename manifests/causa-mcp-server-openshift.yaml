---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-mcp-server
  labels:
    app: causa-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: causa-mcp-server
  template:
    metadata:
      labels:
        app: causa-mcp-server
    spec:
      containers:
        - name: causa-mcp-server
          image: quay.io/bmenghan/causa-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: CAUSA_ENGINE_URL
              value: "http://causa-backend:8080"
            - name: CAUSA_CLUSTER_NAME
              value: "openshift"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: causa-mcp-server
spec:
  selector:
    app: causa-mcp-server
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

---
# Route — exposes the service externally (OpenShift only)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: causa-mcp-server
spec:
  to:
    kind: Service
    name: causa-mcp-server
  port:
    targetPort: 8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
