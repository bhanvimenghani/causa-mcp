# Causa Engine REST API base URL — overridden by CAUSA_ENGINE_URL env var in deployment
quarkus.rest-client.causa-engine-api.url=${CAUSA_ENGINE_URL:http://localhost:8080}

# Causa MCP Server port
quarkus.http.port=8081

# Application name
quarkus.application.name=causa-mcp-server

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.causa.mcp".level=DEBUG
